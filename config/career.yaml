  # Higher travel may be acceptable for exceptional roles.
  allow_exceptions: true

work_preferences:
  prefer:
    - "Hands-on technical ownership"
    - "Complex technical problem-solving"
    - "AI systems engineering"
    - "System architecture"
    - "Autonomous technical decision-making"
    - "Building and deploying production systems"
    - "Substantial, technically challenging projects"

  avoid:
    - "Sales-heavy responsibilities"
    - "Primarily people management"
    - "Repetitive implementations"
    - "Excessive client meetings"
    - "High simultaneous project volume"
    - "Low technical ownership"

evaluation:
  # Initial scoring weights.
  # These are hypotheses we'll refine through feedback.
  weights:
    technical_fit: 0.35
    compensation: 0.20
    location: 0.15
    travel: 0.10
    career_potential: 0.20

  # Opportunities below this score will not be recommended.
  minimum_recommendation_score: 70

constraints:
  # Only objectively disqualifying conditions belong here.
  hard:
    relocation_required: false

  # Preferences that may be overridden for exceptional roles.
  soft:
    minimum_base_salary: 170000
    maximum_travel_percent: 10
    remote_preferred: true